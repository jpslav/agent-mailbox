version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The two-week rule (CLAUDE.md): a release must have been public for 14 days before it is
    # proposed, so a compromised or broken release is usually caught and pulled by then.
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # commander 15 needs Node >= 22.12, and the runtime target is Node >= 18 (the bundle carries
      # commander), so stay on 12: no major updates above it.
      - dependency-name: commander
        versions: ['>= 13']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The two-week rule (CLAUDE.md): a release must have been public for 14 days before it is
    # proposed, so a compromised or broken release is usually caught and pulled by then.
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
